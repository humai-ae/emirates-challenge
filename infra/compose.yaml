name: hrcc

# Images are named emirates-<component>, as in the Azure registry. migrate and api each get their
# own name: one shared tag would be exported by both builds at once and fail. BuildKit shares the
# identical build steps, so the second image costs nothing.
x-api-image: &api-image
  build:
    context: ..
    dockerfile: infra/docker/api.Dockerfile

# The database is Supabase's: by default the local stack (`supabase start`) on the host.
# For a hosted project, set DATABASE_URL, DATABASE_SSL and DATABASE_SSL_CA in the environment.
x-database-env: &database-env
  DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@host.docker.internal:54322/postgres}
  DATABASE_SSL: ${DATABASE_SSL:-disable}
  DATABASE_SSL_CA: ${DATABASE_SSL_CA:-}

# Docker Desktop knows host.docker.internal; Linux needs the mapping.
x-host-gateway: &host-gateway
  extra_hosts:
    - "host.docker.internal:host-gateway"

services:
  migrate:
    <<: [*api-image, *host-gateway]
    image: emirates-migrate
    command: ["sh", "-c", "node dist/database/migrate.js && node dist/database/seed.js"]
    environment:
      <<: *database-env
      # The password demo accounts get when first seeded. Use your own for any shared deployment.
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD:-Emirates-Demo-2026}
    restart: "no"
    networks: [core]

  ai:
    build:
      context: ..
      dockerfile: infra/docker/ai.Dockerfile
    image: emirates-ai
    environment:
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-compose-local-token-0123456789}
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
      TYPESAFE_MODEL: ${TYPESAFE_MODEL:-jev-1.13.0}
      TEXT_MODEL: ${TEXT_MODEL:-gpt-6-luna}
      TEXT_MODEL_BASE_URL: ${TEXT_MODEL_BASE_URL:-}
      TEXT_MODEL_API_KEY: ${TEXT_MODEL_API_KEY:-}
    networks: [core]

  api:
    <<: [*api-image, *host-gateway]
    image: emirates-api
    environment:
      <<: *database-env
      AUTH_MODE: password
      # "true" behind HTTPS (any hosted deployment); plain-HTTP local stack only works with "false".
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      AI_SERVICE_URL: http://ai:3100
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-compose-local-token-0123456789}
      # At most this many new flags a run get AI wording (most severe first).
      AI_WRITE_LIMIT: ${AI_WRITE_LIMIT:-500}
      # Uploaded files: the local stack's Storage unless set (`pnpm supabase:env` writes the key
      # to infra/.env). Without a key the API stops at start-up and says what is missing.
      SUPABASE_URL: ${SUPABASE_URL:-http://host.docker.internal:54321}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:-}
      SUPABASE_STORAGE_BUCKET: ${SUPABASE_STORAGE_BUCKET:-datasets}
    depends_on:
      migrate:
        condition: service_completed_successfully
      ai:
        condition: service_started
    networks: [core, edge]

  proxy:
    build:
      context: ..
      dockerfile: infra/docker/proxy.Dockerfile
    image: emirates-web
    ports:
      - "8080:80"
    depends_on: [api]
    networks: [edge]

networks:
  # ai is only on core; the proxy only reaches api.
  core: {}
  edge: {}

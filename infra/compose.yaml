name: hrcc

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: hrcc
      POSTGRES_PASSWORD: hrcc
      POSTGRES_DB: hrcc
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hrcc -d hrcc"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata: {}

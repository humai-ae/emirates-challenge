name: Deploy

# Rolls the apps out to images already in the registry: give an earlier commit's tag to roll back,
# or the current one to redeploy. Merges to main deploy on their own (build.yml). Run it on main:
# Azure trusts only runs on main.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag, the 7-character SHA of a commit that "Build and deploy" built
        required: true

permissions:
  contents: read
  id-token: write

# Same group as build.yml, so two rollouts never run at once.
concurrency:
  group: rollout
  cancel-in-progress: false

jobs:
  rollout:
    # Keep rollout disabled until setup explicitly selects the agreed shared ACR.
    if: vars.AZURE_REGISTRY == 'mairitacr.azurecr.io'
    runs-on: ubuntu-24.04
    env:
      AZURE_REGISTRY: mairitacr.azurecr.io
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Roll out
        run: scripts/azure/rollout.sh "$TAG"

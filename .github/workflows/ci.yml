name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec biome ci .
      - name: Deployment scripts
        run: |
          bash scripts/azure/rollout.test.sh
          shellcheck scripts/azure/*.sh deploy/promote.sh scripts/supabase-env.sh
      - name: Azure templates
        run: |
          az bicep build --file infra/azure/shared.bicep --stdout > /dev/null
          az bicep build --file infra/azure/apps.bicep --stdout > /dev/null
      # Integration tests start Postgres with Testcontainers; the runner has Docker.
      - run: pnpm turbo run typecheck build
      - run: pnpm turbo run test --filter='!@hrcc/e2e'

  e2e:
    needs: checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: supabase/setup-cli@v3
        with:
          version: 2.120.0
      - name: Start Supabase
        # Studio and its metadata service aren't needed in CI.
        run: supabase start -x studio,postgres-meta
      - run: pnpm supabase:env
      - name: Check the Storage adapter against Supabase
        run: pnpm --filter @hrcc/api test:storage
      - name: Start the stack
        run: |
          docker compose -f infra/compose.yaml up --build -d
          timeout 180 bash -c 'until curl -fsS http://localhost:8080/api/v1/health; do sleep 3; done'
      - run: pnpm --filter @hrcc/e2e exec playwright install --with-deps chromium
      - run: pnpm --filter @hrcc/e2e test
        env:
          CI: "true"
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: tools/e2e/playwright-report
      - if: failure()
        run: docker compose -f infra/compose.yaml logs --no-color
      - if: always()
        run: docker compose -f infra/compose.yaml down -v

name: Build and deploy

# Every merge to main builds the three images, tags them with the commit's short SHA, pushes them
# to the Azure registry and rolls the apps out to them. Until Azure is set up
# (infra/azure/README.md) the jobs are skipped.

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - "infra/docker/**"
      - "scripts/azure/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# A newer merge waits for the current rollout instead of cancelling it half-way. deploy.yml uses
# the same group, so two rollouts never run at once.
concurrency:
  group: rollout
  cancel-in-progress: false

env:
  AZURE_REGISTRY: mairitacr.azurecr.io
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}

jobs:
  images:
    # Keep rollout disabled until setup explicitly selects the agreed shared ACR.
    if: vars.AZURE_REGISTRY == 'mairitacr.azurecr.io'
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - component: api
            dockerfile: infra/docker/api.Dockerfile
          - component: ai
            dockerfile: infra/docker/ai.Dockerfile
          - component: web
            dockerfile: infra/docker/proxy.Dockerfile
    steps:
      - uses: actions/checkout@v7
      # OpenID Connect sign-in, which Azure trusts for runs on main only. The IDs are secrets so
      # that they stay out of the public logs.
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      # The registry has no admin user: the Azure sign-in is exchanged for a registry token.
      - name: Sign in to the registry
        run: |
          token=$(az acr login --name "${AZURE_REGISTRY%%.*}" --expose-token --output tsv --query accessToken)
          echo "$token" | docker login "$AZURE_REGISTRY" \
            --username 00000000-0000-0000-0000-000000000000 --password-stdin
      - name: Choose the tag
        id: tag
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ env.AZURE_REGISTRY }}/emirates-${{ matrix.component }}:${{ steps.tag.outputs.short }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  deploy:
    needs: images
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Roll out
        run: scripts/azure/rollout.sh "${GITHUB_SHA::7}"
